<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zinc Chat</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      box-sizing: border-box;
    }

    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 1rem;
      border-radius: 8px 8px 0 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-top: none;
      min-height: 300px;
    }

    .message {
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .message.self {
      background: #4f46e5;
      color: white;
      margin-left: auto;
      max-width: 80%;
    }

    .message.other {
      background: white;
      margin-right: auto;
      max-width: 80%;
    }

    .chat-input {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: white;
      border: 1px solid #e5e7eb;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.5rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      padding: 0.5rem 1.5rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    .status {
      text-align: center;
      padding: 0.5rem;
      color: #6b7280;
      font-size: 0.875rem;
    }

    .username-container {
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>Zinc Chat - Room: {{.RoomID}}</h2>
    </div>
    <div class="username-container">
      <input type="text" id="username" placeholder="Enter your username" value="User_{{.RandomID}}">
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="status" id="status">Connecting...</div>
    <div class="chat-input">
      <input type="text" id="message" placeholder="Type your message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const username = document.getElementById('username');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('message');
    const statusDiv = document.getElementById('status');

    // Create WebSocket connection
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat/{{.RoomID}}`);

    ws.onopen = () => {
      statusDiv.textContent = 'Connected';
      statusDiv.style.color = '#059669';
    };

    ws.onclose = () => {
      statusDiv.textContent = 'Disconnected';
      statusDiv.style.color = '#dc2626';
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
      statusDiv.textContent = 'Error connecting';
      statusDiv.style.color = '#dc2626';
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        addMessage(data.username, data.message, data.username === username.value);
      } catch (e) {
        console.error('Error parsing message:', e);
      }
    };

    function addMessage(username, text, isSelf) {
      const div = document.createElement('div');
      div.className = `message ${isSelf ? 'self' : 'other'}`;
      div.textContent = `${username}: ${text}`;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text && ws.readyState === WebSocket.OPEN) {
        const message = {
          username: username.value,
          message: text
        };
        ws.send(JSON.stringify(message));
        messageInput.value = '';
      }
    }

    // Send message on Enter key
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Keep connection alive
    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 30000);
  </script>
</body>

</html>
