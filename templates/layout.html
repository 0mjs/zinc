<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | Zinc Framework</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/zinc-icon.svg">
</head>

<body>
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="/" class="logo">
        <span>Zinc</span> Framework
      </a>
      <ul class="nav-links">
        <li><a href="/">Introduction</a></li>
        <li><a href="/getting-started">Getting Started</a></li>
        <li><a href="/guide">Guide</a></li>
        <li><a href="/concepts">Concepts</a></li>
        <li><a href="https://github.com/0mjs/zinc" target="_blank">GitHub</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>{{ .Title }}</h1>
      <p>{{ .Subtitle }}</p>
      <a href="/getting-started" class="button">Get Started</a>
    </div>
  </header>

  <main class="container content">
    {{ .Content }}
  </main>

  <footer>
    <div class="container">
      <ul class="footer-links">
        <li><a href="https://github.com/0mjs/zinc">GitHub</a></li>
        <li><a href="https://github.com/0mjs/zinc/issues">Issues</a></li>
        <li><a href="https://github.com/0mjs/zinc/releases">Releases</a></li>
      </ul>
      <p>&copy; 2024 Zinc Framework. Created by Matt Stevenson.</p>
    </div>
  </footer>

  <script src="/static/js/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
      document.querySelectorAll('pre code').forEach((el) => {
        hljs.highlightElement(el);
      });
    });
  </script>
</body>

</html>
